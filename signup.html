<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriGuardian AI - Signup</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #43a047;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🌱</div>

    <h1>AgriGuardian AI</h1>

    <p class="subtitle">
        Proud of Our Farmers 🌾
    </p>

    <h2 style="text-align:center; margin-bottom:25px;">
        Create Your Account
    </h2>

    <form id="signupForm">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
            minlength="6"
        >

        <button type="submit">
            🌱 Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="/login.html">Login</a>
    </div>

    <div class="footer">
        Your hard work feeds the world.<br>
        AgriGuardian AI is here to support you.
    </div>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.style.color = "#555";
    message.textContent = "Creating your account...";

    try {

        const response = await fetch("/signup", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok && data.success) {

            message.style.color = "green";
            message.textContent = "Account created successfully! Redirecting...";

            localStorage.setItem("userName", name);
            localStorage.setItem("userEmail", email);

            setTimeout(function() {
                window.location.href = "/login.html";
            }, 1500);

        } else {

            message.style.color = "red";
            message.textContent =
                data.message || "Could not create account.";

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";
        message.textContent =
            "Could not connect to AgriGuardian backend.";

    }

});

</script>

</body>
</html>
