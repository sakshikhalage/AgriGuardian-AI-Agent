<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriGuardian AI - Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f3f7f1;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .login-container {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);

            text-align: center;
        }


        .logo {

            font-size: 55px;

            margin-bottom: 5px;
        }


        h1 {

            color: #2e7d32;

            margin-bottom: 8px;

            font-size: 30px;
        }


        .subtitle {

            color: #666;

            margin-bottom: 30px;
        }


        .form-group {

            text-align: left;

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }


        input:focus {

            outline: none;

            border-color: #2e7d32;
        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2e7d32;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }


        .login-button:hover {

            background: #256b29;
        }


        #message {

            margin-top: 18px;

            font-weight: bold;

            line-height: 1.5;
        }


        .signup-link {

            margin-top: 25px;

            color: #666;
        }


        .signup-link a {

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;
        }


        .signup-link a:hover {

            text-decoration: underline;
        }


        .footer-text {

            margin-top: 30px;

            color: #777;

            font-size: 14px;

            line-height: 1.5;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            🌱
        </div>


        <h1>
            AgriGuardian AI
        </h1>


        <p class="subtitle">
            Your Smart Farming Assistant
        </p>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <p id="message"></p>


        <div class="signup-link">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </div>


        <div class="footer-text">

            Your hard work feeds the world. 🌾

            <br>

            AgriGuardian AI is here to support you.

        </div>


    </div>


    <script>


        // =========================
        // Login
        // =========================

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                // Stop normal form submission
                event.preventDefault();


                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                // Show loading message

                message.innerText =
                    "Logging in...";


                try {


                    // Send login request to backend

                    const response = await fetch(
                        "http://127.0.0.1:8000/login",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })

                        }
                    );


                    const data =
                        await response.json();


                    // =========================
                    // Login successful
                    // =========================

                    if (response.ok) {


                        // Save farmer name

                        localStorage.setItem(
                            "farmerName",
                            data.user.name
                        );


                        // Save farmer email

                        localStorage.setItem(
                            "farmerEmail",
                            data.user.email
                        );


                        // Open dashboard

                        window.location.href =
                            "dashboard.html";


                    }


                    // =========================
                    // Login failed
                    // =========================

                    else {

                        message.innerText =
                            data.detail ||
                            "Invalid email or password.";

                    }


                } catch (error) {


                    message.innerText =
                        "Could not connect to AgriGuardian backend.";


                    console.error(error);

                }

            });


    </script>


</body>

</html>
